experiences:
  title: Experiences
  info:
  - role: Software Developer (Telecommunications)
    time: 2023.10.16 - Present
    company: Ericsson
    details: |
      Responsible for the design, implementation, and maintenance of the 5G Core SMF (Session Management Function).  
      Leveraged modern C++20 features and template-based design to improve code reusability and scalability.  
      Collaborated with global customers and peers to provide technical support while ensuring code reliability through TDD practices.
        - Designed a template-based abstract framework to increase code reusability by 40%.
        - Ensured code safety by adhering to Secure Coding Guidelines using clang-tidy.

  - role: Software Developer (In-Vehicle Infotainment)
    time: 2021.01.11 - 2023.10.09
    company: Mediazen
    details: |
      Developed voice recognition software for Hyundai Genesis vehicles, optimizing resources in embedded environments.  
      Implemented hybrid voice recognition systems using HTTP/WebSocket protocols to transmit audio buffers and receive recognition results.
        - Reduced CPU usage by 30% through memory-efficient algorithms using Circular Buffers.
        - Improved maintainability by adopting design patterns for multi-platform support.

